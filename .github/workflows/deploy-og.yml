name: Deploy og.elemat.ch

# Deploys the tagged commit to the `og-elemat-ch` Worker (og.elemat.ch).
# The main elemat.ch Worker is deployed separately and is untouched by this.
# Requires repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and
# CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup must come before setup-node so the pnpm cache works.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # When the Sentry secrets/vars are set the build uploads source maps (then
      # strips the .map files from dist); when they are absent the build still
      # succeeds with the plugin omitted. The tag (e.g. v1.2.3) is the release id.
      - run: pnpm build
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.ref_name }}
          SENTRY_RELEASE: ${{ github.ref_name }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      - name: Deploy og-elemat-ch (og.elemat.ch)
        run: pnpm exec wrangler deploy --config wrangler.og.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
